<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoRide Kribi — Chauffeur</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ocean-deep: #000000;
  --ocean-mid: #17181a;
  --ocean-line: #2c2d30;
  --sand: #ffffff;
  --sand-dim: #9a9ba0;
  --rust: #ff3d1f;
  --rust-bright: #ff5c3d;
  --palm: #26c281;
  --palm-bright: #ff5c3d;
  --ink: #ffffff;
  --accent-text: #ffffff;
  --font-display: 'Fraunces', serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--ocean-deep); color: var(--sand); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font-family: var(--font-body); cursor: pointer; }
::selection { background: var(--rust); color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--rust-bright); outline-offset: 2px; }
.page { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--ocean-line); }
.brand { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: 0.01em; display: flex; align-items: baseline; gap: 6px; }
.brand-mark { color: var(--rust-bright); }
.nav-link { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sand-dim); text-decoration: none; border: 1px solid var(--ocean-line); padding: 8px 12px; border-radius: 100px; transition: border-color 0.15s ease, color 0.15s ease; background: transparent; }
.nav-link:hover { border-color: var(--rust-bright); color: var(--sand); }
.main { flex: 1; padding: 28px 20px 60px; max-width: 560px; width: 100%; margin: 0 auto; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--palm-bright); margin: 0 0 8px; }
h1.title { font-family: var(--font-display); font-size: clamp(28px, 6vw, 38px); font-weight: 600; line-height: 1.1; margin: 0 0 6px; }
.subtitle { color: var(--sand-dim); font-size: 15px; line-height: 1.5; margin: 0 0 28px; }
.route-strip { position: relative; padding: 4px 0 0; margin-bottom: 28px; }
.route-strip-line { position: absolute; top: 21px; left: 14px; right: 14px; height: 2px; background: var(--ocean-line); }
.route-stops { display: flex; gap: 0; position: relative; }
.route-stop { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; background: transparent; border: none; padding: 0 4px; color: var(--sand-dim); }
.route-stop-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ocean-line); background: var(--ocean-deep); transition: all 0.15s ease; }
.route-stop.active .route-stop-dot { border-color: var(--rust-bright); background: var(--rust-bright); box-shadow: 0 0 0 4px rgba(222, 99, 57, 0.2); }
.route-stop-label { font-size: 11px; line-height: 1.3; font-weight: 500; }
.route-stop.active .route-stop-label { color: var(--sand); }
.route-stop-price { font-family: var(--font-mono); font-size: 10px; color: var(--palm-bright); }
.card { background: var(--ocean-mid); border: 1px solid var(--ocean-line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sand-dim); margin-bottom: 6px; }
.field input, .field select { width: 100%; background: var(--ocean-deep); border: 1px solid var(--ocean-line); border-radius: 10px; padding: 13px 14px; color: var(--sand); font-size: 15px; font-family: var(--font-body); }
.field input:focus, .field select:focus { border-color: var(--rust-bright); }
.field input::placeholder { color: var(--sand-dim); opacity: 0.6; }
.fare-display { display: flex; align-items: baseline; justify-content: space-between; padding-top: 16px; margin-top: 4px; border-top: 1px dashed var(--ocean-line); }
.fare-label { font-size: 13px; color: var(--sand-dim); }
.fare-amount { font-family: var(--font-mono); font-size: 26px; font-weight: 600; color: var(--rust-bright); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 20px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; font-family: var(--font-body); transition: transform 0.1s ease, opacity 0.15s ease; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--rust); color: var(--accent-text); }
.btn-primary:hover:not(:disabled) { background: var(--rust-bright); }
.btn-secondary { background: transparent; border: 1px solid var(--ocean-line); color: var(--sand); }
.btn-secondary:hover:not(:disabled) { border-color: var(--sand-dim); }
.btn-ghost { background: transparent; color: var(--sand-dim); font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px; border: none; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 10px; border-radius: 100px; }
.status-pill.attente { background: rgba(255, 61, 31, 0.12); color: var(--rust-bright); }
.status-pill.acceptee { background: rgba(31, 162, 97, 0.12); color: var(--palm); }
.status-pill.terminee { background: rgba(107, 109, 114, 0.12); color: var(--sand-dim); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ride-card { background: var(--ocean-mid); border: 1px solid var(--ocean-line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.ride-route { font-family: var(--font-display); font-size: 17px; margin: 8px 0 4px; }
.ride-meta { font-size: 13px; color: var(--sand-dim); margin-bottom: 12px; }
.ride-price { font-family: var(--font-mono); font-weight: 600; color: var(--rust-bright); }
.empty-state { text-align: center; padding: 50px 20px; color: var(--sand-dim); }
.empty-state-title { font-family: var(--font-display); font-size: 19px; color: var(--sand); margin-bottom: 6px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--ocean-mid); border: 1px solid var(--ocean-line); border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }
.toggle-switch { position: relative; width: 48px; height: 28px; border-radius: 100px; border: none; background: var(--ocean-line); transition: background 0.15s ease; }
.toggle-switch.on { background: var(--palm); }
.toggle-switch-knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--sand); transition: transform 0.15s ease; }
.toggle-switch.on .toggle-switch-knob { transform: translateX(20px); }
.confirmation-banner { background: var(--palm); border-radius: 16px; padding: 24px 20px; text-align: center; margin-bottom: 20px; }
.confirmation-banner .eyebrow { color: rgba(255, 255, 255, 0.85); }
.table-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; }
.stat-chip { flex-shrink: 0; background: var(--ocean-mid); border: 1px solid var(--ocean-line); border-radius: 12px; padding: 12px 16px; min-width: 90px; cursor: pointer; text-align: left; }
.stat-chip-label { font-size: 11px; color: var(--sand-dim); }
.driver-row { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: var(--ocean-deep); border: 1px solid var(--ocean-line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; color: var(--sand); }
.driver-row.selected { background: rgba(255,61,31,0.10); border-color: var(--rust-bright); }
.driver-row-name { display: block; font-weight: 600; font-size: 14px; }
.driver-row-vehicule { font-size: 12px; color: var(--sand-dim); }
.driver-row-distance { font-family: var(--font-mono); font-size: 12px; color: var(--palm-bright); }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, onSnapshot, getDocs,
  updateDoc, query, where, orderBy
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ⚠️ Même config que dans index.html et admin.html.
const firebaseConfig = {
  apiKey: "AIzaSyD8N-6jntmJpOmfKCLTwSDxMzwRVjfwtZ4",
  authDomain: "go-ride-kribi.firebaseapp.com",
  databaseURL: "https://go-ride-kribi-default-rtdb.firebaseio.com",
  projectId: "go-ride-kribi",
  storageBucket: "go-ride-kribi.firebasestorage.app",
  messagingSenderId: "54643982792",
  appId: "1:54643982792:web:98d9e423ac6ac156a000fd",
  measurementId: "G-Z1W4SL3MNE",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const SESSION_KEY = "goride_chauffeur";

function formatFCFA(n) { return new Intl.NumberFormat("fr-FR").format(n) + " FCFA"; }
function distanceKm(lat1, lng1, lat2, lng2) {
  if (lat1 == null || lng1 == null || lat2 == null || lng2 == null) return null;
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLng = ((lng2 - lng1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}
function formatDistance(km) { return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`; }
function escAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

const state = {
  session: null,
  loginTelephone: "", loginPin: "", loginErreur: "", loginEnvoi: false,
  demandesDirectes: [], demandesBroadcast: [], mesCourses: [],
  disponible: false, maPosition: null,
  notifPermission: (typeof Notification !== "undefined") ? Notification.permission : "default",
};

let watchId = null;
let dernierEnvoiPosition = 0;
let audioCtx = null;
let idsConnus = new Set();
let premierChargementBroadcast = true;
let unsubDirect = null, unsubBroadcast = null, unsubMesCourses = null;

const raw = localStorage.getItem(SESSION_KEY);
if (raw) { state.session = JSON.parse(raw); state.disponible = state.session.statut === "disponible"; }

function jouerAlerte() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine"; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.45);
  } catch (e) {}
}

async function connecter(e) {
  e.preventDefault();
  state.loginErreur = ""; state.loginEnvoi = true; render();
  try {
    const q = query(collection(db, "chauffeurs"), where("telephone", "==", state.loginTelephone.trim()));
    const snap = await getDocs(q);
    if (snap.empty) { state.loginErreur = "Numéro non reconnu. Contactez l'administrateur."; return; }
    const docSnap = snap.docs[0];
    const data = docSnap.data();
    if (data.pin !== state.loginPin.trim()) { state.loginErreur = "Code PIN incorrect."; return; }
    if (data.actif === false) { state.loginErreur = "Ce compte a été désactivé. Contactez l'administrateur."; return; }
    const chauffeur = { id: docSnap.id, nom: data.nom, telephone: data.telephone, vehicule: data.vehicule, statut: data.statut || "indisponible" };
    localStorage.setItem(SESSION_KEY, JSON.stringify(chauffeur));
    state.session = chauffeur;
    state.disponible = chauffeur.statut === "disponible";
    demarrerEcouteDashboard();
  } catch (err) {
    state.loginErreur = "Erreur de connexion. Réessayez.";
  } finally {
    state.loginEnvoi = false;
    render();
  }
}

function deconnecter() {
  localStorage.removeItem(SESSION_KEY);
  arreterGeoloc();
  if (unsubDirect) unsubDirect();
  if (unsubBroadcast) unsubBroadcast();
  if (unsubMesCourses) unsubMesCourses();
  state.session = null;
  render();
}

function demarrerEcouteDashboard() {
  const c = state.session;

  unsubDirect = onSnapshot(
    query(collection(db, "courses"), where("statut", "==", "en_attente"), where("chauffeurCibleId", "==", c.id)),
    (snap) => { state.demandesDirectes = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }
  );

  unsubBroadcast = onSnapshot(
    query(collection(db, "courses"), where("statut", "==", "en_attente"), where("chauffeurCibleId", "==", null), orderBy("createdAt", "desc")),
    (snap) => {
      const liste = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!premierChargementBroadcast) {
        const nouvelles = liste.filter((x) => !idsConnus.has(x.id));
        if (nouvelles.length > 0) {
          jouerAlerte();
          if (state.notifPermission === "granted") {
            nouvelles.forEach((x) => new Notification("Nouvelle course GoRide Kribi", { body: `${x.depart} → ${x.destination} · ${formatFCFA(x.tarif)}` }));
          }
        }
      }
      idsConnus = new Set(liste.map((x) => x.id));
      premierChargementBroadcast = false;
      state.demandesBroadcast = liste;
      render();
    }
  );

  unsubMesCourses = onSnapshot(
    query(collection(db, "courses"), where("chauffeurId", "==", c.id), where("statut", "==", "acceptee")),
    (snap) => { state.mesCourses = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }
  );

  if (state.disponible) demarrerGeoloc();
}

function demarrerGeoloc() {
  if (!navigator.geolocation || watchId != null) return;
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      state.maPosition = { lat: latitude, lng: longitude };
      const maintenant = Date.now();
      if (maintenant - dernierEnvoiPosition > 20000) {
        dernierEnvoiPosition = maintenant;
        updateDoc(doc(db, "chauffeurs", state.session.id), { lat: latitude, lng: longitude }).catch(() => {});
      }
      render();
    },
    () => {},
    { enableHighAccuracy: true, maximumAge: 15000 }
  );
}

function arreterGeoloc() {
  if (watchId != null && navigator.geolocation) { navigator.geolocation.clearWatch(watchId); watchId = null; }
}

async function basculerDisponibilite() {
  state.disponible = !state.disponible;
  const nouveauStatut = state.disponible ? "disponible" : "indisponible";
  render();
  await updateDoc(doc(db, "chauffeurs", state.session.id), { statut: nouveauStatut });
  state.session.statut = nouveauStatut;
  localStorage.setItem(SESSION_KEY, JSON.stringify(state.session));
  if (state.disponible) demarrerGeoloc(); else arreterGeoloc();
}

async function accepter(id) {
  try {
    await updateDoc(doc(db, "courses", id), {
      statut: "acceptee",
      chauffeurId: state.session.id,
      chauffeurNom: state.session.nom,
      chauffeurTelephone: state.session.telephone,
      chauffeurVehicule: state.session.vehicule,
    });
  } catch (e) {
    alert("Cette course vient d'être prise par un autre chauffeur.");
  }
}

async function refuser(id) { await updateDoc(doc(db, "courses", id), { chauffeurCibleId: null }); }
async function terminer(id) { await updateDoc(doc(db, "courses", id), { statut: "terminee" }); }

function demanderNotifications() {
  if (typeof Notification === "undefined") return;
  Notification.requestPermission().then((p) => { state.notifPermission = p; render(); });
}

function demandesBroadcastTriees() {
  return [...state.demandesBroadcast].sort((a, b) => {
    if (!state.maPosition) return 0;
    const da = distanceKm(state.maPosition.lat, state.maPosition.lng, a.pickupLat, a.pickupLng);
    const db_ = distanceKm(state.maPosition.lat, state.maPosition.lng, b.pickupLat, b.pickupLng);
    if (da == null) return 1;
    if (db_ == null) return -1;
    return da - db_;
  });
}

function vueLogin() {
  return `
    <header class="topbar">
      <div class="brand"><span class="brand-mark">Go</span>Ride Kribi</div>
      <a href="index.html" class="nav-link">Espace client</a>
    </header>
    <main class="main">
      <p class="eyebrow">Espace chauffeur</p>
      <h1 class="title">Connexion</h1>
      <p class="subtitle">Entrez le numéro et le code fournis par l'administrateur.</p>
      <form class="card" id="form-login">
        <div class="field">
          <label for="telephone">Téléphone</label>
          <input id="telephone" data-field="loginTelephone" placeholder="6XX XX XX XX" value="${escAttr(state.loginTelephone)}">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="pin">Code PIN</label>
          <input id="pin" type="password" inputmode="numeric" data-field="loginPin" placeholder="••••" value="${escAttr(state.loginPin)}">
        </div>
        ${state.loginErreur ? `<p style="color:var(--rust-bright);font-size:13px;margin-top:12px;">${state.loginErreur}</p>` : ""}
        <button class="btn btn-primary" style="margin-top:20px;" ${state.loginEnvoi ? "disabled" : ""}>${state.loginEnvoi ? "Connexion…" : "Se connecter"}</button>
      </form>
    </main>
  `;
}

function vueDashboard() {
  const c = state.session;
  const broadcast = demandesBroadcastTriees();
  return `
    <header class="topbar">
      <div class="brand"><span class="brand-mark">Go</span>Ride</div>
      <button class="btn-ghost" data-action="deconnexion">Déconnexion</button>
    </header>
    <main class="main">
      <p class="eyebrow">Bonjour</p>
      <h1 class="title">${c.nom}</h1>

      <div class="toggle-row">
        <div>
          <div style="font-weight:600;font-size:15px;">${state.disponible ? "Disponible" : "Indisponible"}</div>
          <div style="font-size:12px;color:var(--sand-dim);">${state.disponible ? (state.maPosition ? "Position partagée · vous recevez les demandes" : "Vous recevez les demandes") : "Vous ne recevez rien"}</div>
        </div>
        <button class="toggle-switch ${state.disponible ? "on" : ""}" data-action="disponibilite" aria-label="Basculer disponibilité"><span class="toggle-switch-knob"></span></button>
      </div>

      ${state.notifPermission !== "granted" ? `<button class="btn btn-secondary" style="margin-bottom:20px;" data-action="notifications">Activer les notifications</button>` : ""}

      ${state.mesCourses.length > 0 ? `
        <p class="eyebrow" style="margin-top:4px;">Course(s) en cours</p>
        ${state.mesCourses.map((x) => `
          <div class="ride-card">
            <span class="status-pill acceptee"><span class="status-dot"></span> En cours</span>
            ${x.service === "colis" ? '<p style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sand-dim);margin:0 0 4px;">📦 Colis</p>' : x.typeVehicule === "moto" ? '<p style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sand-dim);margin:0 0 4px;">🏍️ Moto</p>' : ""}
            <p class="ride-route">${x.depart} → ${x.destination}</p>${x.colisDescription ? `<p class="ride-meta">Colis : ${x.colisDescription}</p>` : ""}
            <p class="ride-meta">${x.clientNom} · ${x.clientTelephone}${x.distanceKm ? ` · trajet ${x.distanceKm < 1 ? Math.round(x.distanceKm * 1000) + " m" : x.distanceKm.toFixed(1) + " km"}` : ""}</p>
            <p class="ride-price">${formatFCFA(x.tarif)}</p>
            <button class="btn btn-secondary" style="margin-top:12px;" data-action="terminer" data-id="${x.id}">Marquer comme terminée</button>
          </div>
        `).join("")}
      ` : ""}

      ${state.demandesDirectes.length > 0 ? `
        <p class="eyebrow" style="margin-top:4px;">Demandes pour vous</p>
        ${state.demandesDirectes.map((x) => `
          <div class="ride-card">
            <span class="status-pill attente"><span class="status-dot"></span> Demande directe</span>
            ${x.service === "colis" ? '<p style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sand-dim);margin:0 0 4px;">📦 Colis</p>' : x.typeVehicule === "moto" ? '<p style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sand-dim);margin:0 0 4px;">🏍️ Moto</p>' : ""}
            <p class="ride-route">${x.depart} → ${x.destination}</p>${x.colisDescription ? `<p class="ride-meta">Colis : ${x.colisDescription}</p>` : ""}
            <p class="ride-meta">${x.clientNom} · ${x.clientTelephone}${x.distanceKm ? ` · trajet ${x.distanceKm < 1 ? Math.round(x.distanceKm * 1000) + " m" : x.distanceKm.toFixed(1) + " km"}` : ""}</p>
            <p class="ride-price">${formatFCFA(x.tarif)}</p>
            <div style="display:flex;gap:10px;margin-top:12px;">
              <button class="btn btn-secondary" data-action="refuser" data-id="${x.id}">Refuser</button>
              <button class="btn btn-primary" data-action="accepter" data-id="${x.id}">Accepter</button>
            </div>
          </div>
        `).join("")}
      ` : ""}

      <p class="eyebrow" style="margin-top:4px;">Demandes en attente</p>
      ${broadcast.length === 0 ? `
        <div class="empty-state">
          <div class="empty-state-title">Rien pour l'instant</div>
          <p>Les nouvelles demandes de course apparaîtront ici automatiquement.</p>
        </div>
      ` : broadcast.map((x) => {
        const d = state.maPosition ? distanceKm(state.maPosition.lat, state.maPosition.lng, x.pickupLat, x.pickupLng) : null;
        return `
          <div class="ride-card">
            <span class="status-pill attente"><span class="status-dot"></span> ${x.zoneNom}</span>
            ${x.service === "colis" ? '<p style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sand-dim);margin:0 0 4px;">📦 Colis</p>' : x.typeVehicule === "moto" ? '<p style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sand-dim);margin:0 0 4px;">🏍️ Moto</p>' : ""}
            <p class="ride-route">${x.depart} → ${x.destination}</p>${x.colisDescription ? `<p class="ride-meta">Colis : ${x.colisDescription}</p>` : ""}
            <p class="ride-meta">${x.clientNom} · ${x.clientTelephone}${d != null ? ` · ${formatDistance(d)}` : ""}</p>
            <p class="ride-price">${formatFCFA(x.tarif)}</p>
            <button class="btn btn-primary" style="margin-top:12px;" data-action="accepter" data-id="${x.id}">Accepter cette course</button>
          </div>
        `;
      }).join("")}
    </main>
  `;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `<div class="page">${state.session ? vueDashboard() : vueLogin()}</div>`;

  app.querySelectorAll('[data-field]').forEach((el) => {
    el.addEventListener("input", (e) => { state[el.dataset.field] = e.target.value; });
  });

  const formLogin = document.getElementById("form-login");
  if (formLogin) formLogin.addEventListener("submit", connecter);
}

document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (action === "deconnexion") deconnecter();
  if (action === "disponibilite") basculerDisponibilite();
  if (action === "notifications") demanderNotifications();
  if (action === "accepter") accepter(id);
  if (action === "refuser") refuser(id);
  if (action === "terminer") terminer(id);
});

render();
if (state.session) demarrerEcouteDashboard();
</script>
</body>
</html>
