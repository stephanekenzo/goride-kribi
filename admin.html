<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoRide Kribi — Admin</title>
<meta name="theme-color" content="#0b3b39">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ocean-deep: #0b3b39;
  --ocean-mid: #124d4a;
  --ocean-line: #1c625d;
  --sand: #f1e9d8;
  --sand-dim: #d9cdb0;
  --rust: #c1502e;
  --rust-bright: #de6339;
  --palm: #4c7a5e;
  --palm-bright: #6ba885;
  --ink: #10201c;
  --font-display: 'Fraunces', serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--ocean-deep); color: var(--sand); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font-family: var(--font-body); cursor: pointer; }
::selection { background: var(--rust); color: var(--sand); }
:focus-visible { outline: 2px solid var(--rust-bright); outline-offset: 2px; }
.page { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--ocean-line); }
.brand { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: 0.01em; display: flex; align-items: baseline; gap: 6px; }
.brand-mark { color: var(--rust-bright); }
.nav-link { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sand-dim); text-decoration: none; border: 1px solid var(--ocean-line); padding: 8px 12px; border-radius: 100px; transition: border-color 0.15s ease, color 0.15s ease; background: transparent; }
.nav-link:hover { border-color: var(--rust-bright); color: var(--sand); }
.main { flex: 1; padding: 28px 20px 60px; max-width: 560px; width: 100%; margin: 0 auto; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--palm-bright); margin: 0 0 8px; }
h1.title { font-family: var(--font-display); font-size: clamp(28px, 6vw, 38px); font-weight: 600; line-height: 1.1; margin: 0 0 6px; }
.subtitle { color: var(--sand-dim); font-size: 15px; line-height: 1.5; margin: 0 0 28px; }
.route-strip { position: relative; padding: 4px 0 0; margin-bottom: 28px; }
.route-strip-line { position: absolute; top: 21px; left: 14px; right: 14px; height: 2px; background: var(--ocean-line); }
.route-stops { display: flex; gap: 0; position: relative; }
.route-stop { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; background: transparent; border: none; padding: 0 4px; color: var(--sand-dim); }
.route-stop-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ocean-line); background: var(--ocean-deep); transition: all 0.15s ease; }
.route-stop.active .route-stop-dot { border-color: var(--rust-bright); background: var(--rust-bright); box-shadow: 0 0 0 4px rgba(222, 99, 57, 0.2); }
.route-stop-label { font-size: 11px; line-height: 1.3; font-weight: 500; }
.route-stop.active .route-stop-label { color: var(--sand); }
.route-stop-price { font-family: var(--font-mono); font-size: 10px; color: var(--palm-bright); }
.card { background: var(--ocean-mid); border: 1px solid var(--ocean-line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sand-dim); margin-bottom: 6px; }
.field input, .field select { width: 100%; background: var(--ocean-deep); border: 1px solid var(--ocean-line); border-radius: 10px; padding: 13px 14px; color: var(--sand); font-size: 15px; font-family: var(--font-body); }
.field input:focus, .field select:focus { border-color: var(--rust-bright); }
.field input::placeholder { color: var(--sand-dim); opacity: 0.6; }
.fare-display { display: flex; align-items: baseline; justify-content: space-between; padding-top: 16px; margin-top: 4px; border-top: 1px dashed var(--ocean-line); }
.fare-label { font-size: 13px; color: var(--sand-dim); }
.fare-amount { font-family: var(--font-mono); font-size: 26px; font-weight: 600; color: var(--rust-bright); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 20px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; font-family: var(--font-body); transition: transform 0.1s ease, opacity 0.15s ease; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--rust); color: var(--sand); }
.btn-primary:hover:not(:disabled) { background: var(--rust-bright); }
.btn-secondary { background: transparent; border: 1px solid var(--ocean-line); color: var(--sand); }
.btn-secondary:hover:not(:disabled) { border-color: var(--sand-dim); }
.btn-ghost { background: transparent; color: var(--sand-dim); font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px; border: none; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 10px; border-radius: 100px; }
.status-pill.attente { background: rgba(222, 99, 57, 0.18); color: var(--rust-bright); }
.status-pill.acceptee { background: rgba(107, 168, 133, 0.18); color: var(--palm-bright); }
.status-pill.terminee { background: rgba(217, 205, 176, 0.15); color: var(--sand-dim); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ride-card { background: var(--ocean-mid); border: 1px solid var(--ocean-line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.ride-route { font-family: var(--font-display); font-size: 17px; margin: 8px 0 4px; }
.ride-meta { font-size: 13px; color: var(--sand-dim); margin-bottom: 12px; }
.ride-price { font-family: var(--font-mono); font-weight: 600; color: var(--rust-bright); }
.empty-state { text-align: center; padding: 50px 20px; color: var(--sand-dim); }
.empty-state-title { font-family: var(--font-display); font-size: 19px; color: var(--sand); margin-bottom: 6px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--ocean-mid); border: 1px solid var(--ocean-line); border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }
.toggle-switch { position: relative; width: 48px; height: 28px; border-radius: 100px; border: none; background: var(--ocean-line); transition: background 0.15s ease; }
.toggle-switch.on { background: var(--palm); }
.toggle-switch-knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--sand); transition: transform 0.15s ease; }
.toggle-switch.on .toggle-switch-knob { transform: translateX(20px); }
.confirmation-banner { background: var(--palm); border-radius: 16px; padding: 24px 20px; text-align: center; margin-bottom: 20px; }
.confirmation-banner .eyebrow { color: rgba(241, 233, 216, 0.8); }
.table-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; }
.stat-chip { flex-shrink: 0; background: var(--ocean-mid); border: 1px solid var(--ocean-line); border-radius: 12px; padding: 12px 16px; min-width: 90px; cursor: pointer; text-align: left; }
.stat-chip-label { font-size: 11px; color: var(--sand-dim); }
.driver-row { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: var(--ocean-deep); border: 1px solid var(--ocean-line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; color: var(--sand); }
.driver-row.selected { background: rgba(222,99,57,0.12); border-color: var(--rust-bright); }
.driver-row-name { display: block; font-weight: 600; font-size: 14px; }
.driver-row-vehicule { font-size: 12px; color: var(--sand-dim); }
.driver-row-distance { font-family: var(--font-mono); font-size: 12px; color: var(--palm-bright); }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, onSnapshot, getDoc, setDoc,
  updateDoc, deleteDoc, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ⚠️ Même config que dans index.html et chauffeur.html.
const firebaseConfig = {
  apiKey: "AIzaSyD8N-6jntmJpOmfKCLTwSDxMzwRVjfwtZ4",
  authDomain: "go-ride-kribi.firebaseapp.com",
  databaseURL: "https://go-ride-kribi-default-rtdb.firebaseio.com",
  projectId: "go-ride-kribi",
  storageBucket: "go-ride-kribi.firebasestorage.app",
  messagingSenderId: "54643982792",
  appId: "1:54643982792:web:98d9e423ac6ac156a000fd",
  measurementId: "G-Z1W4SL3MNE",
};

// ⚠️ Changez ce mot de passe. Il protège l'accès au panel admin
// (protection basique côté client — voir la note de sécurité dans le README).
const ADMIN_PASSWORD = "Gustave@1940";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const SESSION_KEY = "goride_admin";

const ZONES_PAR_DEFAUT = [
  { id: "ville", nom: "En ville (intra-muros)", description: "Trajet dans le centre-ville de Kribi", prix: 3000 },
  { id: "sortie_proche", nom: "Sortie ville — proche", description: "Jusqu'au sud de la Dobé", prix: 5000 },
  { id: "sortie_eloignee", nom: "Sortie ville — éloignée", description: "Au-delà, selon distance", prix: 10000 },
  { id: "kribi_douala", nom: "Kribi — Douala", description: "Trajet inter-urbain", prixMin: 40000, prixMax: 45000 },
  { id: "kribi_yaounde", nom: "Kribi — Yaoundé", description: "Trajet inter-urbain", prixMin: 50000, prixMax: 60000 },
];

function formatFCFA(n) { return new Intl.NumberFormat("fr-FR").format(n) + " FCFA"; }
function escAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
function statutClasse(s) { return s === "en_attente" ? "attente" : s === "acceptee" ? "acceptee" : "terminee"; }
function libelleStatut(s) { return s === "en_attente" ? "En attente" : s === "acceptee" ? "En cours" : s === "terminee" ? "Terminée" : s; }

const state = {
  connecte: sessionStorage.getItem(SESSION_KEY) === "ok",
  loginMdp: "", loginErreur: "",
  onglet: "courses",
  courses: [],
  chauffeurs: [], formOuvert: false, enEdition: null,
  fNom: "", fTelephone: "", fVehicule: "", fPin: "",
  zones: ZONES_PAR_DEFAUT, tarifsEnregistres: false,
};

function connecter(e) {
  e.preventDefault();
  if (state.loginMdp === ADMIN_PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, "ok");
    state.connecte = true;
    demarrerEcoutes();
  } else {
    state.loginErreur = "Mot de passe incorrect.";
  }
  render();
}

function demarrerEcoutes() {
  onSnapshot(query(collection(db, "courses"), orderBy("createdAt", "desc")), (snap) => {
    state.courses = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  });
  onSnapshot(collection(db, "chauffeurs"), (snap) => {
    state.chauffeurs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  });
  getDoc(doc(db, "config", "tarifs")).then((snap) => {
    if (snap.exists() && snap.data().zones) { state.zones = snap.data().zones; render(); }
  });
}

function changerOnglet(id) { state.onglet = id; render(); }

function ouvrirNouveauChauffeur() {
  state.formOuvert = true; state.enEdition = null;
  state.fNom = ""; state.fTelephone = ""; state.fVehicule = ""; state.fPin = "";
  render();
}
function ouvrirEditionChauffeur(c) {
  state.formOuvert = true; state.enEdition = c.id;
  state.fNom = c.nom || ""; state.fTelephone = c.telephone || ""; state.fVehicule = c.vehicule || ""; state.fPin = c.pin || "";
  render();
}
function fermerFormChauffeur() { state.formOuvert = false; state.enEdition = null; render(); }

async function enregistrerChauffeur(e) {
  e.preventDefault();
  if (!state.fNom.trim() || !state.fTelephone.trim() || !state.fPin.trim()) return;
  const donnees = { nom: state.fNom.trim(), telephone: state.fTelephone.trim(), vehicule: state.fVehicule.trim(), pin: state.fPin.trim() };
  if (state.enEdition) {
    await updateDoc(doc(db, "chauffeurs", state.enEdition), donnees);
  } else {
    await addDoc(collection(db, "chauffeurs"), { ...donnees, statut: "indisponible", actif: true });
  }
  fermerFormChauffeur();
}

async function basculerActif(c) { await updateDoc(doc(db, "chauffeurs", c.id), { actif: !(c.actif !== false) }); }
async function libererCourse(c) { await updateDoc(doc(db, "courses", c.id), { chauffeurCibleId: null, candidatsIds: [] }); }
async function supprimerChauffeur(c) { if (confirm(`Supprimer ${c.nom} ?`)) await deleteDoc(doc(db, "chauffeurs", c.id)); }

function modifierZone(index, champ, valeur) {
  state.zones = state.zones.map((z, i) => i === index ? { ...z, [champ]: Number(valeur) } : z);
  state.tarifsEnregistres = false;
}
async function enregistrerTarifs() {
  await setDoc(doc(db, "config", "tarifs"), { zones: state.zones });
  state.tarifsEnregistres = true;
  render();
}

function vueLogin() {
  return `
    <header class="topbar">
      <div class="brand"><span class="brand-mark">Go</span>Ride Kribi</div>
      <a href="index.html" class="nav-link">Espace client</a>
    </header>
    <main class="main">
      <p class="eyebrow">Administration</p>
      <h1 class="title">Connexion</h1>
      <form class="card" id="form-login-admin">
        <div class="field" style="margin-bottom:0;">
          <label for="mdp">Mot de passe</label>
          <input id="mdp" type="password" data-field="loginMdp" value="${escAttr(state.loginMdp)}">
        </div>
        ${state.loginErreur ? `<p style="color:var(--rust-bright);font-size:13px;margin-top:12px;">${state.loginErreur}</p>` : ""}
        <button class="btn btn-primary" style="margin-top:20px;">Entrer</button>
      </form>
    </main>
  `;
}

function vueCourses() {
  if (state.courses.length === 0) {
    return `<div class="empty-state"><div class="empty-state-title">Aucune course pour l'instant</div><p>Les réservations des clients apparaîtront ici.</p></div>`;
  }
  return state.courses.map((c) => `
    <div class="ride-card">
      <span class="status-pill ${statutClasse(c.statut)}"><span class="status-dot"></span> ${libelleStatut(c.statut)}</span>
      <p class="ride-route">${c.depart} → ${c.destination}</p>
      <p class="ride-meta">${c.clientNom} · ${c.clientTelephone}${c.chauffeurNom ? ` · Chauffeur : ${c.chauffeurNom}` : ""}${c.distanceKm ? ` · ${c.distanceKm < 1 ? Math.round(c.distanceKm * 1000) + " m" : c.distanceKm.toFixed(1) + " km"}` : ""}</p>
      <p class="ride-price">${formatFCFA(c.tarif)}</p>
      ${c.statut === "en_attente" && c.chauffeurCibleId ? `
        <button class="btn btn-secondary" style="margin-top:12px;" data-action="liberer-course" data-id="${c.id}">
          Libérer à tous les chauffeurs
        </button>
      ` : ""}
    </div>
  `).join("");
}

function vueChauffeurs() {
  let html = "";
  if (!state.formOuvert) {
    html += `<button class="btn btn-primary" style="margin-bottom:20px;" data-action="nouveau-chauffeur">Ajouter un chauffeur</button>`;
  }
  if (state.formOuvert) {
    html += `
      <form class="card" id="form-chauffeur">
        <p style="font-family:var(--font-display);font-size:17px;margin:0 0 16px;">${state.enEdition ? "Modifier le chauffeur" : "Nouveau chauffeur"}</p>
        <div class="field"><label>Nom</label><input data-field="fNom" placeholder="Nom complet" value="${escAttr(state.fNom)}"></div>
        <div class="field"><label>Téléphone</label><input data-field="fTelephone" placeholder="6XX XX XX XX" value="${escAttr(state.fTelephone)}"></div>
        <div class="field"><label>Véhicule</label><input data-field="fVehicule" placeholder="Ex. Toyota Corolla grise" value="${escAttr(state.fVehicule)}"></div>
        <div class="field" style="margin-bottom:0;"><label>Code PIN (4 chiffres)</label><input data-field="fPin" placeholder="1234" inputmode="numeric" value="${escAttr(state.fPin)}"></div>
        <div style="display:flex;gap:10px;margin-top:20px;">
          <button type="button" class="btn btn-secondary" data-action="annuler-chauffeur">Annuler</button>
          <button class="btn btn-primary">${state.enEdition ? "Mettre à jour" : "Enregistrer"}</button>
        </div>
      </form>
    `;
  }
  if (state.chauffeurs.length === 0 && !state.formOuvert) {
    html += `<div class="empty-state"><div class="empty-state-title">Aucun chauffeur enregistré</div><p>Ajoutez vos premiers chauffeurs pour commencer.</p></div>`;
  }
  html += state.chauffeurs.map((c) => `
    <div class="ride-card">
      <span class="status-pill ${c.statut === "disponible" ? "acceptee" : "terminee"}"><span class="status-dot"></span> ${c.statut === "disponible" ? "Disponible" : "Indisponible"}</span>
      <p class="ride-route">${c.nom}</p>
      <p class="ride-meta">${c.telephone} · ${c.vehicule || "véhicule non renseigné"}</p>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
        <button class="btn btn-secondary" data-action="modifier-chauffeur" data-id="${c.id}">Modifier</button>
        <button class="btn btn-secondary" data-action="basculer-actif" data-id="${c.id}">${c.actif === false ? "Réactiver" : "Désactiver"}</button>
        <button class="btn btn-secondary" data-action="supprimer-chauffeur" data-id="${c.id}">Supprimer</button>
      </div>
    </div>
  `).join("");
  return html;
}

function vueTarifs() {
  let html = state.zones.map((z, i) => `
    <div class="card">
      <p style="font-family:var(--font-display);font-size:17px;margin:0 0 4px;">${z.nom}</p>
      <p style="font-size:13px;color:var(--sand-dim);margin:0 0 16px;">${z.description}</p>
      ${"prix" in z ? `
        <div class="field" style="margin-bottom:0;">
          <label>Prix (FCFA)</label>
          <input type="number" data-zone-index="${i}" data-zone-champ="prix" value="${z.prix}">
        </div>
      ` : `
        <div style="display:flex;gap:12px;">
          <div class="field" style="margin-bottom:0;flex:1;"><label>Prix min (FCFA)</label><input type="number" data-zone-index="${i}" data-zone-champ="prixMin" value="${z.prixMin}"></div>
          <div class="field" style="margin-bottom:0;flex:1;"><label>Prix max (FCFA)</label><input type="number" data-zone-index="${i}" data-zone-champ="prixMax" value="${z.prixMax}"></div>
        </div>
      `}
    </div>
  `).join("");
  html += `<button class="btn btn-primary" data-action="enregistrer-tarifs">Enregistrer la grille tarifaire</button>`;
  if (state.tarifsEnregistres) html += `<p style="color:var(--palm-bright);font-size:13px;margin-top:12px;text-align:center;">Grille tarifaire mise à jour.</p>`;
  return html;
}

function vuePanel() {
  const onglets = [["courses", "Courses"], ["chauffeurs", "Chauffeurs"], ["tarifs", "Tarifs"]];
  return `
    <header class="topbar">
      <div class="brand"><span class="brand-mark">Go</span>Ride</div>
      <a href="index.html" class="nav-link">Espace client</a>
    </header>
    <main class="main">
      <p class="eyebrow">Administration</p>
      <h1 class="title">Tableau de bord</h1>
      <div class="table-strip">
        ${onglets.map(([id, label]) => `
          <button class="stat-chip" style="border-color:${state.onglet === id ? "var(--rust-bright)" : "var(--ocean-line)"};" data-action="onglet" data-id="${id}">
            <div class="stat-chip-label" style="color:${state.onglet === id ? "var(--sand)" : "var(--sand-dim)"};">${label}</div>
          </button>
        `).join("")}
      </div>
      ${state.onglet === "courses" ? vueCourses() : ""}
      ${state.onglet === "chauffeurs" ? vueChauffeurs() : ""}
      ${state.onglet === "tarifs" ? vueTarifs() : ""}
    </main>
  `;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `<div class="page">${state.connecte ? vuePanel() : vueLogin()}</div>`;

  app.querySelectorAll('[data-field]').forEach((el) => {
    el.addEventListener("input", (e) => { state[el.dataset.field] = e.target.value; });
  });
  app.querySelectorAll('[data-zone-index]').forEach((el) => {
    el.addEventListener("input", (e) => {
      modifierZone(Number(el.dataset.zoneIndex), el.dataset.zoneChamp, e.target.value);
    });
  });

  const formLogin = document.getElementById("form-login-admin");
  if (formLogin) formLogin.addEventListener("submit", connecter);
  const formChauffeur = document.getElementById("form-chauffeur");
  if (formChauffeur) formChauffeur.addEventListener("submit", enregistrerChauffeur);
}

document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (action === "onglet") changerOnglet(id);
  if (action === "nouveau-chauffeur") ouvrirNouveauChauffeur();
  if (action === "annuler-chauffeur") fermerFormChauffeur();
  if (action === "modifier-chauffeur") { const c = state.chauffeurs.find((x) => x.id === id); if (c) ouvrirEditionChauffeur(c); }
  if (action === "basculer-actif") { const c = state.chauffeurs.find((x) => x.id === id); if (c) basculerActif(c); }
  if (action === "supprimer-chauffeur") { const c = state.chauffeurs.find((x) => x.id === id); if (c) supprimerChauffeur(c); }
  if (action === "enregistrer-tarifs") enregistrerTarifs();
  if (action === "liberer-course") { const c = state.courses.find((x) => x.id === id); if (c) libererCourse(c); }
});

render();
if (state.connecte) demarrerEcoutes();
</script>
