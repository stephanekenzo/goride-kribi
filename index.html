<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoRide Kribi</title>
<meta name="description" content="Réservez un chauffeur à Kribi en quelques secondes">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #f7f7f8;
  --surface-alt: #fff1ee;
  --line: #e8e8ea;
  --accent: #ff3d1f;
  --accent-bright: #ff5c3d;
  --accent-dim: #ffe4dd;
  --success: #1fa261;
  --ink: #101113;
  --ink-dim: #6b6d72;
  --font-display: 'IBM Plex Sans', sans-serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font-family: var(--font-body); cursor: pointer; }
::selection { background: var(--accent); color: #ffffff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-size: 21px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
.brand-mark { color: var(--accent); }
.nav-link { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); text-decoration: none; border: 1px solid var(--line); padding: 8px 12px; border-radius: 100px; background: transparent; }
.nav-link:hover { border-color: var(--accent); color: var(--accent); }
.back-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 16px; color: var(--ink); }

.main { flex: 1; padding: 20px 20px 60px; max-width: 560px; width: 100%; margin: 0 auto; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin: 0 0 8px; font-weight: 600; }
h1.title { font-family: var(--font-display); font-size: clamp(26px, 6vw, 34px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 6px; }
.subtitle { color: var(--ink-dim); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }

/* Barre de recherche façon Yango, sur l'écran d'accueil */
.search-bar { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 24px; text-align: left; }
.search-bar-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.search-bar-text { display: flex; flex-direction: column; }
.search-bar-label { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); }
.search-bar-value { font-size: 15px; font-weight: 600; color: var(--ink); }

.suggestion-list { margin-bottom: 24px; }
.suggestion-row { display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line); padding: 14px 4px; text-align: left; }
.suggestion-row:last-child { border-bottom: none; }
.suggestion-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.suggestion-text { display: flex; flex-direction: column; }
.suggestion-name { font-size: 15px; font-weight: 600; color: var(--ink); }
.suggestion-meta { font-size: 12px; color: var(--ink-dim); }

/* Écran de recherche (deux champs, comme la référence) */
.search-field-group { background: var(--surface); border-radius: 16px; padding: 4px 16px; margin-bottom: 24px; }
.search-field-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.search-field-row:last-child { border-bottom: none; }
.search-field-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.search-field-row input { flex: 1; border: none; background: transparent; font-size: 15px; font-weight: 500; color: var(--ink); font-family: var(--font-body); }
.search-field-row input::placeholder { color: var(--ink-dim); }
.search-field-row input:focus { outline: none; }

.vehicule-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
.vehicule-card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px; text-align: left; }
.vehicule-card.active { border-color: var(--accent); background: var(--accent-dim); }
.vehicule-card-emoji { font-size: 26px; margin-bottom: 10px; }
.vehicule-card-nom { font-weight: 700; font-size: 13px; color: var(--ink); margin-bottom: 2px; }
.vehicule-card-desc { font-size: 11px; color: var(--ink-dim); margin-bottom: 8px; }
.vehicule-card-prix { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); margin-bottom: 6px; }
.field input { width: 100%; background: #ffffff; border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; color: var(--ink); font-size: 15px; font-family: var(--font-body); }
.field input:focus { border-color: var(--accent); outline: none; }
.field input::placeholder { color: var(--ink-dim); opacity: 0.7; }

.fare-display { display: flex; align-items: baseline; justify-content: space-between; padding-top: 16px; margin-top: 4px; border-top: 1px dashed var(--line); }
.fare-label { font-size: 13px; color: var(--ink-dim); }
.fare-amount { font-family: var(--font-mono); font-size: 24px; font-weight: 700; color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 20px; border-radius: 100px; border: none; font-size: 15px; font-weight: 700; font-family: var(--font-body); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #ffffff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-bright); }
.btn-secondary { background: #ffffff; border: 1px solid var(--line); color: var(--ink); }
.btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-ghost { background: transparent; color: var(--ink-dim); font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px; border: none; }

.status-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 10px; border-radius: 100px; }
.status-pill.attente { background: var(--accent-dim); color: var(--accent); }
.status-pill.acceptee { background: rgba(31,162,97,0.12); color: var(--success); }
.status-pill.terminee { background: var(--surface); color: var(--ink-dim); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.ride-route { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin: 8px 0 4px; }
.ride-price { font-family: var(--font-mono); font-weight: 700; color: var(--accent); }

.empty-state { text-align: center; padding: 50px 20px; color: var(--ink-dim); }
.empty-state-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink); margin-bottom: 6px; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }

.confirmation-banner { background: var(--success); border-radius: 16px; padding: 24px 20px; text-align: center; margin-bottom: 20px; }
.confirmation-banner .eyebrow { color: rgba(255,255,255,0.85); }
.chauffeur-info-card { text-align: center; }
.chauffeur-info-card .avatar-cercle { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-family: var(--font-display); font-weight: 700; font-size: 22px; color: #fff; }

.driver-row { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: #ffffff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; color: var(--ink); }
.driver-row.selected { background: var(--accent-dim); border-color: var(--accent); }
.driver-row-name { display: block; font-weight: 600; font-size: 14px; }
.driver-row-vehicule { font-size: 12px; color: var(--ink-dim); }
.driver-row-distance { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, onSnapshot, getDoc,
  serverTimestamp, query, where, updateDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ⚠️ Même config que dans chauffeur.html et admin.html.
const firebaseConfig = {
  apiKey: "AIzaSyD8N-6jntmJpOmfKCLTwSDxMzwRVjfwtZ4",
  authDomain: "go-ride-kribi.firebaseapp.com",
  databaseURL: "https://go-ride-kribi-default-rtdb.firebaseio.com",
  projectId: "go-ride-kribi",
  storageBucket: "go-ride-kribi.firebasestorage.app",
  messagingSenderId: "54643982792",
  appId: "1:54643982792:web:98d9e423ac6ac156a000fd",
  measurementId: "G-Z1W4SL3MNE",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DELAI_CASCADE_MS = 40000;

const ZONES_PAR_DEFAUT = [
  { id: "ville", nom: "En ville", description: "Intra-muros", emoji: "🚗", prix: 3000 },
  { id: "sortie_proche", nom: "Sortie proche", description: "Jusqu'au sud de la Dobé", emoji: "🚙", prix: 5000 },
  { id: "sortie_eloignee", nom: "Sortie éloignée", description: "Au-delà, selon distance", emoji: "🚕", prix: 10000 },
  { id: "kribi_douala", nom: "Kribi — Douala", description: "Trajet inter-urbain", emoji: "🚐", prixMin: 40000, prixMax: 45000 },
  { id: "kribi_yaounde", nom: "Kribi — Yaoundé", description: "Trajet inter-urbain", emoji: "🚐", prixMin: 50000, prixMax: 60000 },
];

// Repères connus de Kribi, proposés en suggestions rapides (comme les
// destinations fréquentes de la référence). Purement indicatif — le
// client peut toujours taper autre chose.
const SUGGESTIONS_KRIBI = [
  { nom: "Plage de Kribi", meta: "Centre-ville", emoji: "🏖️" },
  { nom: "Chutes de la Lobé", meta: "Sortie sud", emoji: "💧" },
  { nom: "Aéroport de Kribi", meta: "Route de Campo", emoji: "✈️" },
  { nom: "Marché central de Kribi", meta: "Centre-ville", emoji: "🛒" },
  { nom: "Port autonome de Kribi", meta: "Mboro", emoji: "⚓" },
  { nom: "Hôpital de District de Kribi", meta: "Centre-ville", emoji: "🏥" },
];

function distanceKm(lat1, lng1, lat2, lng2) {
  if (lat1 == null || lng1 == null || lat2 == null || lng2 == null) return null;
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLng = ((lng2 - lng1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}
function formatDistance(km) {
  if (km == null) return "";
  return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
}
function formatFCFA(n) {
  return new Intl.NumberFormat("fr-FR").format(n) + " FCFA";
}
function prixAffiche(zone) {
  if (zone.prix) return zone.prix;
  if (zone.prixMin && zone.prixMax) return Math.round((zone.prixMin + zone.prixMax) / 2);
  return 0;
}
function escAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

const state = {
  ecran: "accueil", // accueil | recherche | details
  zones: ZONES_PAR_DEFAUT,
  zoneId: ZONES_PAR_DEFAUT[0].id,
  depart: "Ma position actuelle", destination: "", nom: "", telephone: "",
  envoi: false, erreur: "",
  courseId: null, course: null,
  pickupCoords: null, localisation: "recherche", // recherche | ok | refuse
  modeChoix: "auto", // auto | manuel
  chauffeurCible: null, chauffeursDispo: [],
};

let unsubCourse = null;
let unsubChauffeursDispo = null;

getDoc(doc(db, "config", "tarifs")).then((snap) => {
  if (snap.exists() && snap.data().zones) {
    state.zones = snap.data().zones;
    state.zoneId = state.zones[0].id;
    render();
  }
}).catch(() => {});

function zoneActuelle() {
  return state.zones.find((z) => z.id === state.zoneId) || state.zones[0];
}

function ecouterChauffeursDispo() {
  if (unsubChauffeursDispo) return;
  const q = query(collection(db, "chauffeurs"), where("statut", "==", "disponible"));
  unsubChauffeursDispo = onSnapshot(q, (snap) => {
    state.chauffeursDispo = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((c) => c.actif !== false);
    render();
  });
}
ecouterChauffeursDispo();

function chauffeursTries() {
  return [...state.chauffeursDispo].sort((a, b) => {
    if (!state.pickupCoords) return a.nom.localeCompare(b.nom);
    const da = distanceKm(state.pickupCoords.lat, state.pickupCoords.lng, a.lat, a.lng);
    const db_ = distanceKm(state.pickupCoords.lat, state.pickupCoords.lng, b.lat, b.lng);
    if (da == null) return 1;
    if (db_ == null) return -1;
    return da - db_;
  });
}

function localiser() {
  if (!navigator.geolocation) { state.localisation = "refuse"; return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.pickupCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.localisation = "ok";
      render();
    },
    () => { state.localisation = "refuse"; },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
localiser();

function allerA(ecran) { state.ecran = ecran; state.erreur = ""; render(); }
function choisirSuggestion(nom) { state.destination = nom; allerA("details"); }
function setMode(mode) { state.modeChoix = mode; render(); }
function choisirChauffeur(c) { state.chauffeurCible = c; render(); }

function planifierCascade(courseRef, index) {
  setTimeout(async () => {
    let snap;
    try { snap = await getDoc(courseRef); } catch (e) { return; }
    if (!snap.exists()) return;
    const data = snap.data();
    if (data.statut !== "en_attente") return;
    const candidats = data.candidatsIds || [];
    const suivant = index + 1;
    if (suivant < candidats.length) {
      await updateDoc(courseRef, { chauffeurCibleId: candidats[suivant], candidatIndex: suivant });
      planifierCascade(courseRef, suivant);
    } else if (data.chauffeurCibleId !== null) {
      await updateDoc(courseRef, { chauffeurCibleId: null, candidatIndex: suivant });
    }
  }, DELAI_CASCADE_MS);
}

async function reserver(e) {
  e.preventDefault();
  state.erreur = "";
  if (!state.destination.trim() || !state.nom.trim() || !state.telephone.trim()) {
    state.erreur = "Merci de remplir tous les champs.";
    render();
    return;
  }
  if (state.modeChoix === "manuel" && !state.chauffeurCible) {
    state.erreur = "Choisissez un chauffeur dans la liste, ou passez en mode automatique.";
    render();
    return;
  }
  state.envoi = true;
  render();
  const zone = zoneActuelle();

  let chauffeurCibleId = null;
  let candidatsIds = [];
  if (state.modeChoix === "manuel") {
    chauffeurCibleId = state.chauffeurCible.id;
  } else {
    candidatsIds = chauffeursTries().map((c) => c.id);
    chauffeurCibleId = candidatsIds.length > 0 ? candidatsIds[0] : null;
  }

  try {
    const ref = await addDoc(collection(db, "courses"), {
      zoneId: zone.id,
      zoneNom: zone.nom,
      depart: state.depart.trim() || "Ma position actuelle",
      destination: state.destination.trim(),
      clientNom: state.nom.trim(),
      clientTelephone: state.telephone.trim(),
      tarif: prixAffiche(zone),
      statut: "en_attente",
      chauffeurId: null, chauffeurNom: null, chauffeurTelephone: null, chauffeurVehicule: null,
      chauffeurCibleId, candidatsIds, candidatIndex: 0,
      pickupLat: state.pickupCoords ? state.pickupCoords.lat : null,
      pickupLng: state.pickupCoords ? state.pickupCoords.lng : null,
      createdAt: serverTimestamp(),
    });
    state.courseId = ref.id;
    if (candidatsIds.length > 0) planifierCascade(doc(db, "courses", ref.id), 0);

    unsubCourse = onSnapshot(doc(db, "courses", ref.id), (snap) => {
      if (!snap.exists()) return;
      state.course = { id: snap.id, ...snap.data() };
      render();
    });
  } catch (err) {
    state.erreur = "Erreur lors de l'envoi. Réessayez.";
  } finally {
    state.envoi = false;
    render();
  }
}

function nouvelleCourse() {
  if (unsubCourse) { unsubCourse(); unsubCourse = null; }
  state.courseId = null; state.course = null;
  state.destination = ""; state.chauffeurCible = null;
  state.ecran = "accueil";
  render();
}

// ---------- Écrans ----------

function vueAccueil() {
  return `
    <p class="eyebrow">Bonjour</p>
    <h1 class="title">Où allons-nous ?</h1>
    <button type="button" class="search-bar" data-action="ecran" data-id="recherche">
      <span class="search-bar-icon">🔍</span>
      <span class="search-bar-text">
        <span class="search-bar-label">Destination</span>
        <span class="search-bar-value">Entrer une adresse à Kribi</span>
      </span>
    </button>
    <p class="eyebrow">Destinations fréquentes</p>
    <div class="suggestion-list">
      ${SUGGESTIONS_KRIBI.map((s) => `
        <button type="button" class="suggestion-row" data-action="suggestion" data-nom="${escAttr(s.nom)}">
          <span class="suggestion-icon">${s.emoji}</span>
          <span class="suggestion-text">
            <span class="suggestion-name">${s.nom}</span>
            <span class="suggestion-meta">${s.meta}</span>
          </span>
        </button>
      `).join("")}
    </div>
  `;
}

function vueRecherche() {
  return `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
      <button type="button" class="back-btn" data-action="ecran" data-id="accueil">←</button>
      <h1 class="title" style="margin:0;font-size:20px;">Votre trajet</h1>
    </div>
    <div class="search-field-group">
      <div class="search-field-row">
        <span class="search-field-dot" style="background:var(--success);"></span>
        <input data-field="depart" placeholder="Point de départ" value="${escAttr(state.depart)}">
      </div>
      <div class="search-field-row">
        <span class="search-field-dot" style="background:var(--accent);"></span>
        <input id="champ-destination" data-field="destination" placeholder="Où allez-vous ?" value="${escAttr(state.destination)}">
      </div>
    </div>
    <p class="eyebrow">Suggestions</p>
    <div class="suggestion-list">
      ${SUGGESTIONS_KRIBI.map((s) => `
        <button type="button" class="suggestion-row" data-action="suggestion" data-nom="${escAttr(s.nom)}">
          <span class="suggestion-icon">${s.emoji}</span>
          <span class="suggestion-text">
            <span class="suggestion-name">${s.nom}</span>
            <span class="suggestion-meta">${s.meta}</span>
          </span>
        </button>
      `).join("")}
    </div>
    <button type="button" class="btn btn-primary" data-action="valider-recherche" ${!state.destination.trim() ? "disabled" : ""}>
      Continuer
    </button>
  `;
}

function vueDetails() {
  const zone = zoneActuelle();
  const tarif = prixAffiche(zone);
  return `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
      <button type="button" class="back-btn" data-action="ecran" data-id="recherche">←</button>
      <h1 class="title" style="margin:0;font-size:20px;">Choisissez votre trajet</h1>
    </div>
    <p class="subtitle" style="margin-bottom:16px;">${state.depart} → <strong style="color:var(--ink);">${state.destination}</strong></p>

    <div class="vehicule-grid">
      ${state.zones.map((z) => `
        <button type="button" class="vehicule-card ${z.id === state.zoneId ? "active" : ""}" data-action="zone" data-id="${z.id}">
          <div class="vehicule-card-emoji">${z.emoji || "🚗"}</div>
          <div class="vehicule-card-nom">${z.nom}</div>
          <div class="vehicule-card-desc">${z.description || ""}</div>
          <div class="vehicule-card-prix">${z.prix ? formatFCFA(z.prix) : `${formatFCFA(z.prixMin)}–${formatFCFA(z.prixMax)}`}</div>
        </button>
      `).join("")}
    </div>

    <div class="card" style="padding-bottom:14px;">
      <label style="display:block;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin-bottom:10px;">
        Attribution du chauffeur
      </label>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn ${state.modeChoix === "auto" ? "btn-primary" : "btn-secondary"}" style="flex:1;font-size:13px;padding:10px 8px;" data-action="mode" data-id="auto">Automatique</button>
        <button type="button" class="btn ${state.modeChoix === "manuel" ? "btn-primary" : "btn-secondary"}" style="flex:1;font-size:13px;padding:10px 8px;" data-action="mode" data-id="manuel">Choisir moi-même</button>
      </div>
      ${state.modeChoix === "auto" ? `
        <p style="font-size:12px;color:var(--ink-dim);margin-top:12px;margin-bottom:0;">
          Le chauffeur disponible le plus proche est contacté en premier. S'il ne répond pas sous 40 secondes, le suivant est contacté automatiquement.
        </p>
      ` : vueChoixChauffeur()}
    </div>

    <form class="card" id="form-reservation">
      <div class="field">
        <label for="nom">Votre nom</label>
        <input id="nom" data-field="nom" placeholder="Nom et prénom" value="${escAttr(state.nom)}">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label for="telephone">Votre téléphone</label>
        <input id="telephone" data-field="telephone" placeholder="6XX XX XX XX" value="${escAttr(state.telephone)}">
      </div>
      <div class="fare-display">
        <span class="fare-label">${zone.nom}</span>
        <span class="fare-amount">${zone.prix ? formatFCFA(zone.prix) : `~ ${formatFCFA(tarif)}`}</span>
      </div>
      ${!zone.prix ? `<p style="font-size:12px;color:var(--ink-dim);margin-top:8px;">Prix indicatif (${formatFCFA(zone.prixMin)} – ${formatFCFA(zone.prixMax)}), confirmé avec le chauffeur.</p>` : ""}
      ${state.erreur ? `<p style="color:var(--accent);font-size:13px;margin-top:12px;">${state.erreur}</p>` : ""}
      <button class="btn btn-primary" style="margin-top:16px;" ${state.envoi ? "disabled" : ""} data-action="reserver">
        ${state.envoi ? "Envoi en cours…" : (state.modeChoix === "manuel" && state.chauffeurCible ? `Commander avec ${state.chauffeurCible.nom}` : "Commander une course")}
      </button>
    </form>
  `;
}

function vueChoixChauffeur() {
  const liste = chauffeursTries();
  return `
    <div style="margin-top:16px;">
      ${liste.length === 0 ? `<p style="font-size:13px;color:var(--ink-dim);">Aucun chauffeur disponible pour le moment.</p>` : ""}
      ${liste.map((c) => {
        const d = state.pickupCoords ? distanceKm(state.pickupCoords.lat, state.pickupCoords.lng, c.lat, c.lng) : null;
        const selected = state.chauffeurCible && state.chauffeurCible.id === c.id;
        return `
          <button type="button" class="driver-row ${selected ? "selected" : ""}" data-action="choisir-chauffeur" data-id="${c.id}">
            <span><span class="driver-row-name">${c.nom}</span><span class="driver-row-vehicule">${c.vehicule || "véhicule non renseigné"}</span></span>
            <span class="driver-row-distance">${d != null ? formatDistance(d) : ""}</span>
          </button>
        `;
      }).join("")}
    </div>
  `;
}

function vueSuivi() {
  const c = state.course;
  if (!c) return `<p class="subtitle">Chargement…</p>`;
  if (c.statut === "en_attente") {
    const enCascade = c.candidatsIds && c.candidatsIds.length > 0 && c.chauffeurCibleId;
    return `
      <div class="card" style="text-align:center;padding:32px 20px;">
        <span class="status-pill attente"><span class="status-dot"></span> En attente</span>
        <h2 style="font-family:var(--font-display);font-weight:800;font-size:22px;margin:16px 0 8px;">Recherche d'un chauffeur…</h2>
        <p class="subtitle" style="margin-bottom:0;">
          ${enCascade
            ? "Le chauffeur disponible le plus proche a été contacté en premier. S'il ne répond pas, le suivant sera contacté automatiquement."
            : c.chauffeurCibleId
            ? "Votre demande a été envoyée au chauffeur choisi."
            : "Votre demande a été envoyée à tous les chauffeurs disponibles."}
          Cette page se mettra à jour dès qu'un chauffeur accepte.
        </p>
      </div>
    `;
  }
  if (c.statut === "acceptee") {
    const initiale = (c.chauffeurNom || "?").trim().charAt(0).toUpperCase();
    return `
      <div class="confirmation-banner">
        <p class="eyebrow">Chauffeur trouvé</p>
        <h2 style="font-family:var(--font-display);font-weight:800;font-size:24px;margin:6px 0 0;color:#fff;">${c.chauffeurNom}</h2>
      </div>
      <div class="card chauffeur-info-card">
        <div class="avatar-cercle">${initiale}</div>
        <div class="field" style="margin-bottom:12px;text-align:left;"><label>Véhicule</label><p style="margin:0;">${c.chauffeurVehicule || "—"}</p></div>
        <div class="field" style="margin-bottom:0;text-align:left;"><label>Téléphone</label><p style="margin:0;font-family:var(--font-mono);">${c.chauffeurTelephone || "—"}</p></div>
      </div>
      <p class="ride-route">${c.depart} → ${c.destination}</p>
      <p class="ride-price">${formatFCFA(c.tarif)}</p>
      <button class="btn btn-secondary" style="margin-top:20px;" data-action="nouvelle-course">Nouvelle réservation</button>
    `;
  }
  return `
    <div class="card" style="text-align:center;">
      <p class="subtitle" style="margin-bottom:16px;">Course ${c.statut}.</p>
      <button class="btn btn-secondary" data-action="nouvelle-course">Nouvelle réservation</button>
    </div>
  `;
}

function render() {
  const app = document.getElementById("app");
  let contenu;
  if (state.courseId) contenu = vueSuivi();
  else if (state.ecran === "recherche") contenu = vueRecherche();
  else if (state.ecran === "details") contenu = vueDetails();
  else contenu = vueAccueil();

  app.innerHTML = `
    <div class="page">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">Go</span>Ride Kribi</div>
        <a href="chauffeur.html" class="nav-link">Espace chauffeur</a>
      </header>
      <main class="main">${contenu}</main>
    </div>
  `;

  app.querySelectorAll('[data-field]').forEach((el) => {
    el.addEventListener("input", (e) => {
      state[el.dataset.field] = e.target.value;
      if (el.dataset.field === "destination" && state.ecran === "recherche") {
        const btn = document.querySelector('[data-action="valider-recherche"]');
        if (btn) btn.disabled = !state.destination.trim();
      }
    });
  });

  const form = document.getElementById("form-reservation");
  if (form) form.addEventListener("submit", reserver);

  const champDest = document.getElementById("champ-destination");
  if (champDest && state.ecran === "recherche" && !state.destination) champDest.focus();
}

document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === "ecran") { allerA(btn.dataset.id); }
  if (action === "suggestion") { choisirSuggestion(btn.dataset.nom); }
  if (action === "valider-recherche") { if (state.destination.trim()) allerA("details"); }
  if (action === "zone") { state.zoneId = btn.dataset.id; render(); }
  if (action === "mode") { setMode(btn.dataset.id); }
  if (action === "choisir-chauffeur") {
    const c = state.chauffeursDispo.find((x) => x.id === btn.dataset.id);
    if (c) choisirChauffeur(c);
  }
  if (action === "nouvelle-course") { nouvelleCourse(); }
});

render();
</script>
</body>
</html>
