<style>
:root {
  --bg: #000000;

  --surface-alt: #1f2023;

  --accent-bright: #ff5c3d;
  --accent-dim: #3a1c15;

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--white); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }

.nav-link { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); text-decoration: none; border: 1px solid var(--line); padding: 8px 12px; border-radius: 100px; background: transparent; }

.back-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 16px; color: var(--white); }

.subtitle { color: var(--dim); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }

// ---- Petit "compte" local (sans vrai système d'authentification) :
// profil, adresses et code promo sont conservés sur cet appareil.
function lireLocal(cle, defaut) {
  try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; } catch (e) { return defaut; }
}
function ecrireLocal(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (e) {}
}

function distanceKm(lat1, lng1, lat2, lng2) {
  if (lat1 == null || lng1 == null || lat2 == null || lng2 == null) return null;
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLng = ((lng2 - lng1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}
function formatDistance(km) {
  if (km == null) return "";
  return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
}
function formatFCFA(n) {
  return new Intl.NumberFormat("fr-FR").format(Math.round(n)) + " FCFA";
}
function prixAffiche(zone) {
  if (zone.prix) return zone.prix;
  if (zone.prixMin && zone.prixMax) return Math.round((zone.prixMin + zone.prixMax) / 2);

}
function escAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}
function arrondi100(n) {
  return Math.round(n / 100) * 100;
}
function appliquerPromo(prix) {
  const p = state.promo;
  if (!p) return prix;
  const reduit = p.type === "pourcentage" ? prix * (1 - p.valeur / 100) : prix - p.valeur;
  return Math.max(0, arrondi100(reduit));
}

function chauffeursTries() {
  return [...state.chauffeursDispo].sort((a, b) => {
    if (!state.pickupCoords) return a.nom.localeCompare(b.nom);
    const da = distanceKm(state.pickupCoords.lat, state.pickupCoords.lng, a.lat, a.lng);
    const db_ = distanceKm(state.pickupCoords.lat, state.pickupCoords.lng, b.lat, b.lng);
    if (da == null) return 1;
    if (db_ == null) return -1;
    return da - db_;
  });
}

function localiser() {
  if (!navigator.geolocation) { state.localisation = "refuse"; return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.pickupCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.localisation = "ok";
      render();
    },
    () => { state.localisation = "refuse"; },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// Calcul du trajet par la distance réelle (vol d'oiseau) entre la
// position du client et la destination choisie, si les deux sont connues.
function trajetCalcule() {
  if (!state.pickupCoords || !state.destCoords) return null;
  const km = distanceKm(state.pickupCoords.lat, state.pickupCoords.lng, state.destCoords.lat, state.destCoords.lng);
  const prixVoiture = Math.max(state.tarifKm.prixMinimum, arrondi100(km * state.tarifKm.prixParKm));
  const prixMoto = Math.max(Math.round(state.tarifKm.prixMinimum * REMISE_MOTO), arrondi100(km * state.tarifKm.prixParKm * REMISE_MOTO));
  return { km, prixVoiture, prixMoto };
}

  else if (id === "voyage") { state.service = "course"; state.typeVehicule = "voiture"; state.zoneId = IDS_VOYAGE[0]; state.destCoords = null; state.destination = ""; allerA("voyage-details"); }
  else if (id === "colis") { state.service = "colis"; state.colisDepart = ""; allerA("colis"); }

}

function planifierCascade(courseRef, index) {
  setTimeout(async () => {
    let snap;
    try { snap = await getDoc(courseRef); } catch (e) { return; }
    if (!snap.exists()) return;
    const data = snap.data();
    if (data.statut !== "en_attente") return;
    const candidats = data.candidatsIds || [];
    const suivant = index + 1;
    if (suivant < candidats.length) {
      await updateDoc(courseRef, { chauffeurCibleId: candidats[suivant], candidatIndex: suivant });
      planifierCascade(courseRef, suivant);
    } else if (data.chauffeurCibleId !== null) {
      await updateDoc(courseRef, { chauffeurCibleId: null, candidatIndex: suivant });
    }
  }, DELAI_CASCADE_MS);
}

function prixCourseActuel() {
  const t = trajetCalcule();
  let base;
  if (t) base = state.typeVehicule === "moto" ? t.prixMoto : t.prixVoiture;
  else {
    const zone = zoneActuelle();
    const b = prixAffiche(zone);
    base = state.typeVehicule === "moto" && !IDS_VOYAGE.includes(zone.id) ? arrondi100(b * REMISE_MOTO) : b;
  }
  return appliquerPromo(base);
}

async function reserver(e) {
  e.preventDefault();
  state.erreur = "";
  if (!state.destination.trim() || !state.nom.trim() || !state.telephone.trim()) {
    state.erreur = "Merci de remplir tous les champs.";
    render();
    return;
  }
  if (state.modeChoix === "manuel" && !state.chauffeurCible) {
    state.erreur = "Choisissez un chauffeur dans la liste, ou passez en mode automatique.";
    render();
    return;
  }
  state.envoi = true;
  render();

  const t = trajetCalcule();
  const zone = zoneActuelle();
  const tarif = prixCourseActuel();

  let chauffeurCibleId = null;
  let candidatsIds = [];
  if (state.modeChoix === "manuel") {
    chauffeurCibleId = state.chauffeurCible.id;
  } else {
    candidatsIds = chauffeursTries().map((c) => c.id);
    chauffeurCibleId = candidatsIds.length > 0 ? candidatsIds[0] : null;
  }

  try {
    const ref = await addDoc(collection(db, "courses"), {
      service: "course",
      typeVehicule: state.typeVehicule,
      zoneId: t ? null : zone.id,
      zoneNom: t ? "Trajet calculé" : zone.nom,
      distanceKm: t ? t.km : null,
      depart: state.depart.trim() || "Ma position actuelle",
      destination: state.destination.trim(),
      clientNom: state.nom.trim(),
      clientTelephone: state.telephone.trim(),
      tarif,
      statut: "en_attente",
      chauffeurId: null, chauffeurNom: null, chauffeurTelephone: null, chauffeurVehicule: null,
      chauffeurCibleId, candidatsIds, candidatIndex: 0,
      pickupLat: state.pickupCoords ? state.pickupCoords.lat : null,
      pickupLng: state.pickupCoords ? state.pickupCoords.lng : null,
      createdAt: serverTimestamp(),
    });
    demarrerSuivi(ref.id, candidatsIds);
  } catch (err) {
    state.erreur = "Erreur lors de l'envoi. Réessayez.";
    state.envoi = false;
    render();
  }
}

    ${state.promo ? `
      <div class="card" style="text-align:center;">
        <p style="font-size:13px;color:var(--dim);margin:0 0 8px;">Code actif</p>
        <p style="font-family:var(--font-display);font-weight:800;font-size:22px;margin:0 0 4px;color:var(--accent-bright);">${state.promo.code}</p>
        <p style="font-size:13px;color:var(--dim);margin:0 0 16px;">${state.promo.type === "pourcentage" ? `-${state.promo.valeur}%` : `-${formatFCFA(state.promo.valeur)}`} sur vos prochaines courses</p>
        <button type="button" class="btn btn-secondary" data-action="retirer-promo">Retirer ce code</button>
      </div>
    ` : `
      <form class="card" id="form-promo">
        <div class="field" style="margin-bottom:0;">
          <label for="promoSaisie">Code promotionnel</label>
          <input id="promoSaisie" data-field="promoSaisie" placeholder="Ex. BIENVENUE" value="${escAttr(state.promoSaisie)}" style="text-transform:uppercase;">
        </div>
        ${state.promoErreur ? `<p style="color:var(--accent-bright);font-size:13px;margin-top:12px;">${state.promoErreur}</p>` : ""}
        <button class="btn btn-primary" style="margin-top:16px;" ${state.promoVerif ? "disabled" : ""} data-action="appliquer-promo">${state.promoVerif ? "Vérification…" : "Appliquer"}</button>
      </form>
    `}
  `;
}

function vueChoixChauffeur() {
  const liste = chauffeursTries();
  return `
    <div style="margin-top:16px;">
      ${liste.length === 0 ? `<p style="font-size:13px;color:var(--dim);">Aucun chauffeur disponible pour le moment.</p>` : ""}
      ${liste.map((c) => {
        const d = state.pickupCoords ? distanceKm(state.pickupCoords.lat, state.pickupCoords.lng, c.lat, c.lng) : null;
        const selected = state.chauffeurCible && state.chauffeurCible.id === c.id;
        return `
          <button type="button" class="driver-row ${selected ? "selected" : ""}" data-action="choisir-chauffeur" data-id="${c.id}">
            <span><span class="driver-row-name">${c.nom}</span><span class="driver-row-vehicule">${c.vehicule || "véhicule non renseigné"}</span></span>
            <span class="driver-row-distance">${d != null ? formatDistance(d) : ""}</span>
          </button>
        `;
      }).join("")}
    </div>
  `;
}

function vueSuivi() {
  const c = state.course;
  if (!c) return `<p class="subtitle">Chargement…</p>`;
  if (c.statut === "en_attente") {
    const enCascade = c.candidatsIds && c.candidatsIds.length > 0 && c.chauffeurCibleId;
    return `
      <div class="card" style="text-align:center;padding:32px 20px;">
        <span class="status-pill attente"><span class="status-dot"></span> En attente</span>
        <h2 style="font-family:var(--font-display);font-weight:800;font-size:22px;margin:16px 0 8px;">${c.service === "colis" ? "Recherche d'un livreur…" : "Recherche d'un chauffeur…"}</h2>
        <p class="subtitle" style="margin-bottom:0;">
          ${enCascade
            ? "Le plus proche a été contacté en premier. Sans réponse, le suivant sera contacté automatiquement."
            : "Votre demande a été envoyée aux chauffeurs disponibles."}
          Cette page se mettra à jour dès qu'un chauffeur accepte.
        </p>
      </div>
    `;
  }
  if (c.statut === "acceptee") {
    const initiale = (c.chauffeurNom || "?").trim().charAt(0).toUpperCase();
    return `
      <div class="confirmation-banner">
        <p class="eyebrow">Chauffeur trouvé</p>
        <h2 style="font-family:var(--font-display);font-weight:800;font-size:24px;margin:6px 0 0;">${c.chauffeurNom}</h2>
      </div>
      <div class="card chauffeur-info-card">
        <div class="avatar-cercle">${initiale}</div>
        <div class="field" style="margin-bottom:12px;text-align:left;"><label>Véhicule</label><p style="margin:0;">${c.chauffeurVehicule || "—"}</p></div>
        <div class="field" style="margin-bottom:0;text-align:left;"><label>Téléphone</label><p style="margin:0;font-family:var(--font-mono);">${c.chauffeurTelephone || "—"}</p></div>
      </div>
      <p class="ride-route">${c.depart} → ${c.destination}</p>
      <p class="ride-price">${formatFCFA(c.tarif)}${c.distanceKm ? ` · ${formatDistance(c.distanceKm)}` : ""}</p>
      <button class="btn btn-secondary" style="margin-top:20px;" data-action="nouvelle-course">Nouvelle réservation</button>
    `;
  }
  return `
    <div class="card" style="text-align:center;">
      <p class="subtitle" style="margin-bottom:16px;">Course ${c.statut}.</p>
      <button class="btn btn-secondary" data-action="nouvelle-course">Nouvelle réservation</button>
    </div>
  `;
}

function render() {
  const app = document.getElementById("app");
  let contenu;
  if (state.courseId) contenu = vueSuivi();
  else if (state.ecran === "recherche") contenu = vueRecherche();
  else if (state.ecran === "details" || state.ecran === "tarifs-fixes") { if (state.ecran === "tarifs-fixes") state.destCoords = null; contenu = vueDetails(); }
  else if (state.ecran === "voyage-details") contenu = vueVoyageDetails();
  else if (state.ecran === "colis") contenu = vueColis();
  else if (state.ecran === "special") contenu = vueSpecial();
  else if (state.ecran === "location-catalogue") contenu = vueLocationCatalogue();
  else if (state.ecran === "location-details") contenu = vueLocationDetails();
  else if (state.ecran === "restos-catalogue") contenu = vueRestosCatalogue();
  else if (state.ecran === "resto-details") contenu = vueRestoDetails();
  else if (state.ecran === "compte") contenu = vueCompte();
  else if (state.ecran === "historique") contenu = vueHistorique();
  else if (state.ecran === "adresses") contenu = vueAdresses();
  else if (state.ecran === "parametres") contenu = vueParametres();
  else if (state.ecran === "assistance") contenu = vueAssistance();
  else if (state.ecran === "reductions") contenu = vueReductions();
  else contenu = vueAccueil();

  app.innerHTML = `
    <div class="page">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">Go</span>Ride Kribi</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <a href="chauffeur.html" class="nav-link">Espace chauffeur</a>
          <button type="button" class="avatar-btn" data-action="ecran" data-id="compte">${state.avatar}</button>
        </div>
      </header>
      <main class="main">${contenu}</main>
    </div>
  `;

  app.querySelectorAll('[data-field]').forEach((el) => {
    const evt = el.tagName === "TEXTAREA" ? "input" : "input";
    el.addEventListener(evt, (e) => {
      state[el.dataset.field] = e.target.value;
      if (el.dataset.field === "destination" && state.ecran === "recherche") {
        const btn = document.querySelector('[data-action="valider-recherche"]');
        if (btn) btn.disabled = !state.destination.trim();
      }
    });
  });

  const formCourse = document.getElementById("form-reservation");
  if (formCourse) formCourse.addEventListener("submit", reserver);
  const formVoyage = document.getElementById("form-voyage");
  if (formVoyage) formVoyage.addEventListener("submit", reserver);
  const formColis = document.getElementById("form-colis");
  if (formColis) formColis.addEventListener("submit", envoyerColis);
  const formSpecial = document.getElementById("form-special");
  if (formSpecial) formSpecial.addEventListener("submit", envoyerDemandeSpeciale);
  const formLocation = document.getElementById("form-location");
  if (formLocation) formLocation.addEventListener("submit", envoyerDemandeLocation);
  const formAdresse = document.getElementById("form-adresse");
  if (formAdresse) formAdresse.addEventListener("submit", ajouterAdresse);
  const formParametres = document.getElementById("form-parametres");
  if (formParametres) formParametres.addEventListener("submit", sauvegarderProfil);
  const formPromo = document.getElementById("form-promo");
  if (formPromo) formPromo.addEventListener("submit", appliquerCodePromo);

  const champDest = document.getElementById("champ-destination");
  if (champDest && state.ecran === "recherche" && !state.destination) champDest.focus();
}

document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === "service") { choisirService(btn.dataset.id); }
  if (action === "ecran") { if (btn.dataset.id === "historique") state.historiqueCharge = false; allerA(btn.dataset.id); }
  if (action === "suggestion") { choisirSuggestion(btn.dataset.nom, btn.dataset.lat ? parseFloat(btn.dataset.lat) : null, btn.dataset.lng ? parseFloat(btn.dataset.lng) : null); }
  if (action === "valider-recherche") { if (state.destination.trim()) allerA("details"); }
  if (action === "zone") { state.zoneId = btn.dataset.id; render(); }
  if (action === "type-vehicule") { setTypeVehicule(btn.dataset.id); }
  if (action === "mode") { setMode(btn.dataset.id); }
  if (action === "choisir-chauffeur") {
    const c = state.chauffeursDispo.find((x) => x.id === btn.dataset.id);
    if (c) choisirChauffeur(c);
  }
  if (action === "vehicule") {
    const v = state.vehicules.find((x) => x.id === btn.dataset.id);
    if (v) choisirVehicule(v);
  }
  if (action === "resto") { choisirResto(RESTAURANTS_KRIBI[Number(btn.dataset.id)]); }
  if (action === "livraison-resto") { demanderLivraisonResto(); }
  if (action === "avatar") { choisirAvatar(btn.dataset.id); }
  if (action === "ajouter-adresse") { /* géré par le submit du formulaire */ }
  if (action === "supprimer-adresse") { supprimerAdresse(Number(btn.dataset.id)); }
  if (action === "retirer-promo") { retirerPromo(); }
  if (action === "nouvelle-course") { nouvelleCourse(); }
});

render();
</script>
</body>
</html>
